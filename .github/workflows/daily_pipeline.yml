# Phase 2: run the ingestion script every morning.
# Phase 4: add a dbt build step after ingestion.

name: Daily flight pipeline

on:
  workflow_dispatch:          # manual run from the Actions tab
    inputs:
      flight_date:
        description: "Sydney-local date to (re)fetch, YYYY-MM-DD. Leave empty for yesterday."
        required: false
        default: ""

permissions:
  contents: read

# Never run two ingestions at once (e.g. a manual run overlapping the scheduled one).
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Fetch flights and load to Postgres
        env:
          FLIGHT_API_KEY: ${{ secrets.FLIGHT_API_KEY }}
          FLIGHT_API_HOST: ${{ secrets.FLIGHT_API_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FLIGHT_DATE: ${{ inputs.flight_date }}   # empty on scheduled runs
        # Pass the date as an env var, not inline ${{ }}, so the input can't inject shell commands.
        run: python ingestion/fetch_flights.py $FLIGHT_DATE
